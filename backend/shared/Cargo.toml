[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[dependencies]
id_macro = { path = "../id_macro" }

dyn-clone = "1.0"
regex = "1.11"
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.89"
lapin = "3.2.1"
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
thiserror = "2.0"
dyn-fmt = "0.4"
actix-web = { version = "4.9", features = ["cookies"] }
rust_decimal = "1.37"

sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }

email_address = "0.2"

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]

claims = "0.8"
mockall = "0.13"