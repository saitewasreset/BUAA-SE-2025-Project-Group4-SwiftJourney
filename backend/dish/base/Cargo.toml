[package]
name = "dish_base"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../../shared" }
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.16", features = ["v4"] }

chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

async-trait = "0.1"

rust_decimal = "1.37"

tracing = "0.1"

lapin = "2.5"

