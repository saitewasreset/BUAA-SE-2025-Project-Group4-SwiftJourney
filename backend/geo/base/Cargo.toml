[package]
name = "geo_base"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../../shared" }
id_macro = { path = "../../id_macro" }
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1.0"

sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
