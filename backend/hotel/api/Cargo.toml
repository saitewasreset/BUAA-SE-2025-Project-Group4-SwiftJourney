[package]
name = "hotel_api"
version = "0.1.0"
edition = "2024"

[dependencies]

hotel_base = { path = "../base" }
shared = { path = "../../shared" }
migration = { path = "../../migration" }

sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }

actix-web = { version = "4.9", features = ["cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"