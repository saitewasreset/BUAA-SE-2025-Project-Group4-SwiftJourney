version: '3.8'

services:
  # Gateway
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "8080:80"
    volumes:
      - ./docker-compose-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - user
      - geo
      - train
      - hotel
      - dish
      - order
      - object-storage
    networks:
      - swiftjourney-net

  # Frontend
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    networks:
      - swiftjourney-net

  # Backend Microservices
  user:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        BIN: user_api
      network: host
    container_name: user
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/user_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq/%2f
      - TZ_OFFSET_HOUR=8
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DATA_PATH=../data
      - SERVER_NAME=127.0.0.1:8080
      - AUTO_SCHEDULE_DAYS=14
    networks:
      - swiftjourney-net

  geo:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        BIN: geo_api
      network: host
    container_name: geo
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/geo_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq/%2f
      - TZ_OFFSET_HOUR=8
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DATA_PATH=../data
      - SERVER_NAME=127.0.0.1:8080
      - AUTO_SCHEDULE_DAYS=14
    networks:
      - swiftjourney-net

  train:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        BIN: train_api
      network: host
    container_name: train
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/train_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq/%2f
      - TZ_OFFSET_HOUR=8
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DATA_PATH=../data
      - SERVER_NAME=127.0.0.1:8080
      - AUTO_SCHEDULE_DAYS=14
    networks:
      - swiftjourney-net

  hotel:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        BIN: hotel_api
      network: host
    container_name: hotel
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/hotel_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq/%2f
      - TZ_OFFSET_HOUR=8
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DATA_PATH=../data
      - SERVER_NAME=127.0.0.1:8080
      - AUTO_SCHEDULE_DAYS=14
    networks:
      - swiftjourney-net

  dish:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        BIN: dish_api
      network: host
    container_name: dish
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dish_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq/%2f
      - TZ_OFFSET_HOUR=8
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DATA_PATH=../data
      - SERVER_NAME=127.0.0.1:8080
      - AUTO_SCHEDULE_DAYS=14
    networks:
      - swiftjourney-net

  order:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        BIN: order_api
      network: host
    container_name: order
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/order_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq/%2f
      - TZ_OFFSET_HOUR=8
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DATA_PATH=../data
      - SERVER_NAME=127.0.0.1:8080
      - AUTO_SCHEDULE_DAYS=14
    networks:
      - swiftjourney-net

  object-storage:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        BIN: object_storage_api
      network: host
    container_name: object-storage
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DEBUG=1
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq/%2f
      - TZ_OFFSET_HOUR=8
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DATA_PATH=../data
      - SERVER_NAME=127.0.0.1:8080
      - AUTO_SCHEDULE_DAYS=14
    networks:
      - swiftjourney-net

  # Database
  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftjourney-net

  # Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - swiftjourney-net

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      mc alias set swiftjourney http://minio:9000 swiftjourney swiftjourney

      mc admin accesskey create --access-key ${MINIO_ACCESS_KEY} --secret-key ${MINIO_SECRET_KEY} swiftjourney

      exit 0;
      "
    networks:
      - swiftjourney-net

  rabbitmq:
    image: rabbitmq
    healthcheck:
      # use the flag --erlang-cookie if setting the erlang
      # cookie was necessary (comment by red-riding-hood)
      # test: rabbitmq-diagnostics -q ping --erlang-cookie "mycookie"
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - swiftjourney-net
    ports:
      - "5672:5672"

volumes:
  postgres_data:
  minio_data:

networks:
  swiftjourney-net:
    driver: bridge
