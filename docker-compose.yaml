services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swiftjourney
      POSTGRES_PASSWORD: swiftjourney
      POSTGRES_DB: swiftjourney
      TZ: Asia/Shanghai
      LANG: zh_CN.utf-8
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=zh-CN --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftjourney -d $$POSTGRES_DB"]
      start_period: 1m
      start_interval: 5s
      interval: 10m
      timeout: 30s
      retries: 3

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      start_period: 1m
      start_interval: 5s
      interval: 10m
      timeout: 30s
      retries: 3

  rabbitmq:
    image: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: swiftjourney
      RABBITMQ_DEFAULT_PASS: swiftjourney

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: swiftjourney
      MINIO_ROOT_PASSWORD: swiftjourney
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc
    volumes:
      - minio_data:/data
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      sh -c "
      if [ ! -f /data/.minio_initialized ]; then
        echo '正在初始化 MinIO 配置...';
        sleep 3;  # 等待 MinIO 完全启动
        mc alias set swiftjourney http://minio:9000 swiftjourney swiftjourney;
        mc admin accesskey create --access-key 'ForSuperEarth!' --secret-key 'WorkersOfTheWorld,Unite!' swiftjourney;
        touch /data/.minio_initialized;
        echo '初始化完成！';
      else
        echo 'MinIO 已初始化，跳过配置...';
      fi
      "
    restart: on-failure

  # Microservices
  user:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        - BIN=user_api
      network: host
    environment:
      DEBUG: 1
      RUST_LOG: info
      DATABASE_URL: postgres://swiftjourney:swiftjourney@db/swiftjourney
      RABBITMQ_URL: amqp://swiftjourney:swiftjourney@rabbitmq/%2f
      TZ_OFFSET_HOUR: 8
      DATA_PATH: /init_data
      SERVER_NAME: 127.0.0.1:8080
    volumes:
      - backend_data:/instance
      - ./data:/init_data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  geo:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        - BIN=geo_api
      network: host
    environment:
      RUST_LOG: info
      DATABASE_URL: postgres://swiftjourney:swiftjourney@db/swiftjourney
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  train:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        - BIN=train_api
      network: host
    environment:
      RUST_LOG: info
      DATABASE_URL: postgres://swiftjourney:swiftjourney@db/swiftjourney
      RABBITMQ_URL: amqp://swiftjourney:swiftjourney@rabbitmq/%2f
      TZ_OFFSET_HOUR: 8
      AUTO_SCHEDULE_DAYS: 14
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  hotel:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        - BIN=hotel_api
      network: host
    environment:
      DEBUG: 1
      RUST_LOG: info
      DATABASE_URL: postgres://swiftjourney:swiftjourney@db/swiftjourney
      RABBITMQ_URL: amqp://swiftjourney:swiftjourney@rabbitmq/%2f
      DATA_PATH: /init_data
      SERVER_NAME: 127.0.0.1:8080
    volumes:
      - ./data:/init_data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  dish:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        - BIN=dish_api
      network: host
    environment:
      DEBUG: 1
      RUST_LOG: info
      DATABASE_URL: postgres://swiftjourney:swiftjourney@db/swiftjourney
      RABBITMQ_URL: amqp://swiftjourney:swiftjourney@rabbitmq/%2f
      TZ_OFFSET_HOUR: 8
      AUTO_SCHEDULE_DAYS: 14
      DATA_PATH: /init_data
    volumes:
      - ./data:/init_data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  order:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        - BIN=order_api
      network: host
    environment:
      DEBUG: 1
      RUST_LOG: info
      DATABASE_URL: postgres://swiftjourney:swiftjourney@db/swiftjourney
      RABBITMQ_URL: amqp://swiftjourney:swiftjourney@rabbitmq/%2f
      TZ_OFFSET_HOUR: 8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  object-storage:
    build:
      context: ./backend
      dockerfile: Dockerfile.ms
      args:
        - BIN=object_storage_api
      network: host
    environment:
      DEBUG: 1
      RUST_LOG: info
      DATABASE_URL: postgres://swiftjourney:swiftjourney@db/swiftjourney
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ForSuperEarth!
      MINIO_SECRET_KEY: WorkersOfTheWorld,Unite!
      SERVER_NAME: 127.0.0.1:8080
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - object_storage

  frontend:
    build:
      context: ./frontend
      network: host

  swift_journey:
    build:
      network: host
    image: nginx:alpine
    depends_on:
      - frontend
      - user
      - geo
      - train
      - hotel
      - dish
      - order
      - object-storage
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped

networks:
  default:
    name: swiftjourney_default

volumes:
  postgres_data:
  backend_data:
  redis_data:
  minio_data:
