user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Upstreams inside the default docker network
    upstream user_upstream { server user:8080; }
    upstream geo_upstream { server geo:8080; }
    upstream train_upstream { server train:8080; }
    upstream hotel_upstream { server hotel:8080; }
    upstream dish_upstream { server dish:8080; }
    upstream order_upstream { server order:8080; }
    upstream object_storage_upstream { server object-storage:8080; }

    upstream frontend_upstream {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Forward real ip headers
        proxy_set_header Host $http_host;  # keep port
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    # Microservice HTTP routes
    location /api/user/ { proxy_pass http://user_upstream; }
    location /api/general/ { proxy_pass http://geo_upstream; }
    location /api/train/ { proxy_pass http://train_upstream; }
    location /api/hotel/ { proxy_pass http://hotel_upstream; }
    location /api/dish/ { proxy_pass http://dish_upstream; }
    location /api/order/ { proxy_pass http://order_upstream; }
    location /resource/ { proxy_pass http://object_storage_upstream; }

        # Static files from frontend
        location / {
            proxy_pass http://frontend_upstream;
        }
    }
}
