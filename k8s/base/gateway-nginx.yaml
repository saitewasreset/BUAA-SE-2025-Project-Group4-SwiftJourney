apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: swiftjourney
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-nginx-config
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: swiftjourney
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-config
  namespace: swiftjourney
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;

    events { worker_connections  1024; }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile        on;
      keepalive_timeout  65;

      upstream user_upstream { server user:8080; }
      upstream geo_upstream { server geo:8080; }
      upstream train_upstream { server train:8080; }
      upstream hotel_upstream { server hotel:8080; }
      upstream dish_upstream { server dish:8080; }
      upstream order_upstream { server order:8080; }
      upstream object_storage_upstream { server object-storage:8080; }
      upstream frontend_upstream { server frontend:80; }

      server {
        listen 80;
        server_name _;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Microservice routes
        location /api/user/ { proxy_pass http://user_upstream; }
        location /api/general/ { proxy_pass http://geo_upstream; }
        location /api/train/ { proxy_pass http://train_upstream; }
        location /api/hotel/ { proxy_pass http://hotel_upstream; }
        location /api/dish/ { proxy_pass http://dish_upstream; }
        location /api/order/ { proxy_pass http://order_upstream; }
        location /api/payment/ { proxy_pass http://order_upstream; }
        location /resource/ { proxy_pass http://object_storage_upstream; }
        location / { proxy_pass http://frontend_upstream; }
      }
    }
