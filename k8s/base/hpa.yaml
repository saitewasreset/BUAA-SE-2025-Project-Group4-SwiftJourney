## Horizontal Pod Autoscalers for backend microservices
## 核心服务: user, order, train, geo  -> 较高 minReplicas 与保守的 scaleDown; 保障核心功能
## 非核心服务: hotel, dish  -> 较低 minReplicas 与更激进的 scaleDown; 资源紧张时优先降级
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
  namespace: swiftjourney
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 10
      policies:
        - type: Pods
          value: 2
          periodSeconds: 20
    scaleDown:
      stabilizationWindowSeconds: 10
      policies:
        - type: Percent
          value: 30
          periodSeconds: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 20
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60

