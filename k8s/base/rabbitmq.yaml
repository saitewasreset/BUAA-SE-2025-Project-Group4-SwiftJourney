apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: swiftjourney
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                { secretKeyRef: { name: app-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                { secretKeyRef: { name: app-secrets, key: RABBITMQ_PASS } }
          ports:
            - containerPort: 5672
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: swiftjourney
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
