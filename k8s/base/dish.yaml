apiVersion: apps/v1
kind: Deployment
metadata:
  name: dish
  namespace: swiftjourney
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dish
  template:
    metadata:
      labels:
        app: dish
    spec:
      containers:
        - name: dish
          image: saitewasreset/swiftjourney-dish:v0.1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          env:
            - name: RUST_LOG
              valueFrom:
                { configMapKeyRef: { name: app-config, key: RUST_LOG } }
            - name: DEBUG
              value: "1"
            - name: POSTGRES_USER
              valueFrom:
                { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom:
                { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom:
                { secretKeyRef: { name: app-secrets, key: POSTGRES_DB } }
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db/$(POSTGRES_DB)
            - name: RABBITMQ_USER
              valueFrom:
                { secretKeyRef: { name: app-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASS
              valueFrom:
                { secretKeyRef: { name: app-secrets, key: RABBITMQ_PASS } }
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq/%2f
            - name: TZ_OFFSET_HOUR
              valueFrom:
                { configMapKeyRef: { name: app-config, key: TZ_OFFSET_HOUR } }
            - name: AUTO_SCHEDULE_DAYS
              valueFrom:
                {
                  configMapKeyRef:
                    { name: app-config, key: AUTO_SCHEDULE_DAYS },
                }
            - name: DATA_PATH
              value: /init_data
          volumeMounts:
            - name: init-data
              mountPath: /init_data
          ports: [{ containerPort: 8080 }, { containerPort: 23333 }]
          readinessProbe:
            {
              tcpSocket: { port: 8080 },
              initialDelaySeconds: 5,
              periodSeconds: 10,
            }
          livenessProbe:
            {
              tcpSocket: { port: 8080 },
              initialDelaySeconds: 15,
              periodSeconds: 20,
            }
      volumes:
        - name: init-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dish
  namespace: swiftjourney
spec:
  selector: { app: dish }
  ports:
    [
      { name: http, port: 8080, targetPort: 8080 },
      { name: internal, port: 23333, targetPort: 23333 },
    ]
