apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: swiftjourney
resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - storage.yaml
  - db.yaml
  - redis.yaml
  - rabbitmq.yaml
  - minio.yaml
  - minio-init-job.yaml
  - backend.yaml
  - frontend.yaml
  # - vpa-backend.yaml
  # - vpa-frontend.yaml
  - gateway-nginx.yaml
  - ingress.yaml
  - hpa-backend.yaml
images:
  - name: saitewasreset/swiftjourney-backend
    newTag: v0.1.0
  - name: saitewasreset/swiftjourney-frontend
    newTag: v0.1.0
